<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      table {
        font-family: Arial, Helvetica, sans-serif;
        border: 1px solid rgb(196, 190, 190);
        border-collapse: collapse;
      }
      th,
      td {
        border: 1px solid rgb(196, 190, 190);
        border-collapse: collapse;
      }
    </style>
  </head>
  <body>
    <div>
      <h1>Mokinių tvarkaraščio pavyzdys</h1>
      <table>
        <tr>
          <th>Diena</th>
          <th>Dalykas</th>
          <th>Klasė</th>
          <th>Pastaba</th>
        </tr>
        <tr>
          <td rowspan="2" style="background-color: #67b5cb;">Pirmadienis</td>
          <td style="background-color: #81eb81;">Matematika</td>
          <td rowspan="2" style="background-color: #eeb3d7;">5A</td>
          <td style="background-color: #eeeb90;">Kontrolinis</td>
        </tr>
        <tr>
          <td style="background-color: #e39002;">Lietuvių kalba</td>
          <td style="background-color: #9baa9b;">Namų darbai</td>
        </tr>
        <tr>
          <td style="background-color: #ef564b;">Antradienis</td>
          <td colspan="2" style="background-color: #0f715f;">Kūno kultūra (jungtinė pamoka)</td>
          <td style="background-color: #eeb3d7;">Sporto salė</td>
        </tr>
      </table>
    </div>
  </body>
</html>
